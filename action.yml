name: "ReSharper"
author: DevOps
description: Run ReSharper

inputs:
  solution-name:
    description: The name of your solution file
    required: true
  exclude-list:
    description: Semicolon separated list of values inside double quotes
    required: true
  severity-level:
    description: Severity Level
    required: true
  file-type:
    description: xml or json
    default: 'xml'
    required: false
  tool-version:
    description: The version of the tool to use
    default: '2024.3.6'
    required: false

runs:
  using: "composite"
  steps:
    - id: resharper-action
      uses: JetBrains/ReSharper-InspectCode@v0.8
      with:
        format: '${{ inputs.file-type }}'
        output:  'inspections.${{ inputs.file-type }}'
        severity: 'ERROR'
        solution: '${{ inputs.solution-name }}'
        tool-version: '${{ inputs.tool-version }}'
        # exclude: '${{ inputs.exclude-list }}'
    - id: upload-results
      uses: actions/upload-artifact@v4
      with:
        path: 'inspections.${{ inputs.file-type }}'
        if-no-files-found: ignore
