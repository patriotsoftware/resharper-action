name: "ReSharper"
author: DevOps
description: Run ReSharper

inputs:
  solution-name:
    description: The name of your solution file
    required: true
  exclude-list:
    description: Semicolon separated list of values inside double quotes
    required: true
  severity-level:
    description: Severity Level
    required: true
  file-type:
    description: xml or json
    default: 'xml'
    required: false
  tool-version:
    description: The version of the tool to use
    default: '2024.3.6'
    required: false

runs:
  using: "composite"
  steps:
    - id: resharper-action
      uses: JetBrains/ReSharper-InspectCode@v0.3
      with:
        solution: '${{ inputs.solution-name }}'
        output: 'inspections.${{ inputs.file-type }}'
        format: '${{ inputs.file-type }}'
        # exclude: '${{ inputs.exclude-list }}'
        severity: '${{ inputs.severity-level }}'
        tool-version: '${{ inputs.tool-version }}'
